<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شهادة حضور – الورشة التدريبية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f2f2f2;--sheet:#fff;--box:#f2f2f2;--ink:#231546;--text:#4a6882;--soft:#77adc9;--line:#1c323d;--blue:#2c6fb6;--green:#36ab7e;--btn-ink:#fff;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--sheet:#1e2329;--box:#262d35;--ink:#e4e0ff;--text:#a9c1d4;--soft:#77adc9;--line:#6b8494;--blue:#5a9be0;--green:#4cc596;--btn-ink:#15181d;--err:#ffb4ab}}
:root[data-theme="dark"]{--bg:#15181d;--sheet:#1e2329;--box:#262d35;--ink:#e4e0ff;--text:#a9c1d4;--soft:#77adc9;--line:#6b8494;--blue:#5a9be0;--green:#4cc596;--btn-ink:#15181d;--err:#ffb4ab}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;line-height:1.6}
main{max-width:940px;margin:0 auto;padding:18px 14px 40px}
.sheet{background:var(--sheet);padding:18px 22px 0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tag{flex:1 1 0;max-width:270px;border:1px solid var(--line);background:var(--box);color:var(--ink);font-weight:700;text-align:center;padding:9px 10px;font-size:.98rem}
.logo{height:64px;width:auto;flex:none;display:block}
.logo-box{background:#fff;flex:none}
h1{width:fit-content;max-width:100%;margin:18px auto 0;padding:14px 60px;background:var(--box);border-bottom:2px solid var(--soft);color:var(--ink);font-size:1.7rem;text-align:center}
p.sub{margin:22px 0 18px;text-align:center;color:var(--text);font-size:1.1rem;font-weight:500}
.form{max-width:640px;margin:0 auto}
label{display:block;font-weight:700;color:var(--ink);margin-bottom:8px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:11px 14px;border:1px solid var(--line);border-radius:0;background:var(--sheet);color:var(--ink)}
input::placeholder{color:var(--soft)}
input:focus,button:focus-visible{outline:3px solid var(--soft);outline-offset:1px}
button{font:inherit;font-weight:700;padding:11px 22px;border:1px solid var(--ink);border-radius:0;background:var(--ink);color:var(--btn-ink);cursor:pointer}
button.alt{background:var(--box);color:var(--ink);border-color:var(--line);border-bottom:2px solid var(--soft)}
#sug{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);background:var(--sheet)}
#sug:empty{display:none}
#sug li{padding:10px 14px;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--box)}
#sug li:last-child{border:0}
#sug li:hover,#sug li.on{background:var(--box)}
#msg{margin:10px 0 0;color:var(--err);min-height:1.4em}
#result{margin-top:20px}
#result[hidden]{display:none}
.cert-wrap{border:1px solid var(--line);background:#fff}
#cert{display:block;width:100%;height:auto}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.hint{margin:10px 0 0;text-align:center;font-size:.9rem;color:var(--text)}
.dots{height:40px;margin:26px -22px 0;background:radial-gradient(circle,var(--blue) 3.5px,transparent 4px) 0 50%/26px 14px repeat-x;direction:ltr}
@media (max-width:640px){
  main{padding:0 0 28px}
  .sheet{padding:14px 12px 0}
  .top{flex-wrap:wrap;justify-content:center;gap:8px}
  .logo-box{order:-1;width:100%;display:flex;justify-content:center}
  .logo{height:56px}
  .tag{flex:1 1 calc(50% - 4px);max-width:none;font-size:.82rem;padding:8px 6px}
  h1{padding:10px 32px;font-size:1.35rem;margin-top:14px}
  p.sub{margin:16px 0 14px;font-size:1rem}
  .row{flex-direction:column}
  input{font-size:16px}
  button{width:100%;padding:13px 16px}
  .cert-wrap{margin:0 -12px;border-left:0;border-right:0}
  .actions{flex-direction:column}
  .dots{margin:20px -12px 0}
}
@media print{
  @page{size:landscape;margin:0}
  body{background:#fff}
  main{padding:0;max-width:none}
  .sheet{padding:0}
  .sheet>*:not(#result){display:none!important}
  #result{margin:0}
  .actions,.hint{display:none}
  .cert-wrap{border:0}
  #cert{width:100vw}
}
</style>
</head>

const W = 2667, H = 1500;
// موضع الاسم فوق خط "للمعلمة" (بالبكسل على صورة الشهادة)
const POS = {cx: 1247, base: 598, maxW: 780, size: 64, color: "#2b1f6e"};

const $ = id => document.getElementById(id);
const norm = s => s.replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim().toLowerCase();
const index = NAMES.map(n => ({n, k: norm(n)}));
let cur = "", curCanvas = null, active = -1, items = [];

const bg = new Image();
const bgReady = new Promise(r => { bg.onload = r; bg.src = IMG_SRC; });

function showSug(){
  const q = norm($("name").value);
  items = q ? index.filter(x => x.k.includes(q)).slice(0,6).map(x => x.n) : [];
  active = -1;
  $("sug").innerHTML = "";
  items.forEach((n,i) => {
    const li = document.createElement("li");
    li.textContent = n; li.setAttribute("role","option");
    li.onclick = () => { $("name").value = n; $("sug").innerHTML = ""; generate(); };
    $("sug").appendChild(li);
  });
}

async function generate(){
  $("msg").textContent = "";
  const q = norm($("name").value);
  if(!q){ $("msg").textContent = "اكتبي اسمك أولاً."; return; }
  let hit = index.find(x => x.k === q);
  if(!hit){
    const part = index.filter(x => x.k.includes(q));
    if(part.length === 1) hit = part[0];
  }
  if(!hit){
    $("result").hidden = true;
    $("msg").textContent = "لم نجد هذا الاسم في القائمة. اكتبيه كما هو مسجّل، أو اختاريه من الاقتراحات.";
    return;
  }
  $("name").value = hit.n; $("sug").innerHTML = "";
  await bgReady;
  try { await document.fonts.load("700 64px Tajawal", hit.n); } catch(e){}
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.drawImage(bg, 0, 0, W, H);
  let size = POS.size;
  const font = s => `700 ${s}px Tajawal, "Segoe UI", Tahoma, sans-serif`;
  g.direction = "rtl"; g.textAlign = "center"; g.textBaseline = "alphabetic"; g.fillStyle = POS.color;
  g.font = font(size);
  while(g.measureText(hit.n).width > POS.maxW && size > 28){ size -= 2; g.font = font(size); }
  g.fillText(hit.n, POS.cx, POS.base);
  cur = hit.n; curCanvas = c;
  $("cert").src = c.toDataURL("image/jpeg", 0.95);
  $("result").hidden = false;
  $("result").scrollIntoView({behavior:"smooth", block:"start"});
}

async function saveFile(filename, blob){
  const d = window.claude ? await window.claude.use("downloads") : null;
  if(d){
    try { await d.save({filename, data: blob}); }
    catch(e){ if(!e || e.code !== "declined") $("msg").textContent = "تعذّر حفظ الملف. حاولي مرة أخرى."; }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
$("dlPng").onclick = () => curCanvas.toBlob(b => saveFile("شهادة حضور - " + cur + ".jpg", b), "image/jpeg", 0.95);
$("dlPdf").onclick = () => {
  const {jsPDF} = window.jspdf || {};
  if(!jsPDF){ $("msg").textContent = "تعذّر تجهيز ملف PDF الآن. استخدمي تحميل الصورة."; return; }
  const d = new jsPDF({orientation:"landscape", unit:"px", format:[960,540]});
  d.addImage($("cert").src, "JPEG", 0, 0, 960, 540);
  saveFile("شهادة حضور - " + cur + ".pdf", d.output("blob"));
};
$("print").onclick = () => { try { window.print(); } catch(e){} };
$("go").onclick = generate;
$("name").addEventListener("input", showSug);
$("name").addEventListener("keydown", e => {
  const lis = $("sug").children;
  if(e.key === "ArrowDown" && lis.length){ e.preventDefault(); active = (active+1) % lis.length; }
  else if(e.key === "ArrowUp" && lis.length){ e.preventDefault(); active = (active-1+lis.length) % lis.length; }
  else if(e.key === "Enter"){ e.preventDefault(); if(active >= 0) $("name").value = items[active]; generate(); return; }
  else return;
  [...lis].forEach((l,i) => l.classList.toggle("on", i === active));
});
</script>
